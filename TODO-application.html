<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--adding the title to the website-->
    <title>Todos Application</title>
    <!--adding the CSS file to HTMl-->
    <link rel="stylesheet" href="TODO-application.css"/>
</head>
<body>
    <div class="container">
        <!--adding the heading -->
        <h1>Todos Application</h1>
        <!-- with the input tag , we enter the TODO list items -->
        <input type="text" id="todoInput" class="todo-input" placeholder="Add a new todo...">
        <!--adding the button-->
        <button class="add-btn" onclick="addTodo()">Add</button>
        <ul id="todos" class="todos "></ul>
    </div>

   <script type="text/javascript" src="TODO-application.js"></script>
</body>
</html>
